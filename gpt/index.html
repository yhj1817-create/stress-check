function render1(){let completed=state.answers.filter(x=>x!==null).length;let c=calc();return `<section class="panel"><div class="kicker">STEP 1 · KOSS-SF1 · 26문항</div><h2>나의 직무스트레스 요인 확인하기</h2><p class="muted">최근 한 달 동안의 느낌과 경험을 기준으로 답해주세요. 모든 문항은 4점 척도입니다.</p><div class="grid no-print"><div class="field"><label for="gender">참고치 적용 성별</label><select id="gender"><option value="f" ${state.gender==='f'?'selected':''}>여성 참고치</option><option value="m" ${state.gender==='m'?'selected':''}>남성 참고치</option></select></div><div class="field"><label for="role">교육 참여 역할</label><select id="role"><option value="supervisor" ${state.role==='supervisor'?'selected':''}>관리감독자</option><option value="worker" ${state.role==='worker'?'selected':''}>근로자</option></select></div></div><div class="note">출처: KOSHA GUIDE E-G-2-2025, 별표 3·4. 참고치는 집단 내 상대적 위치를 보여주며 질병 진단이나 개인의 건강 위험도를 확정하지 않습니다.</div><div class="no-print"><div class="progress"><div style="width:${completed/26*100}%"></div></div><p class="small">응답 ${completed} / 26문항</p>${questions.map((q,i)=>`<div class="question" id="q${i}"><strong>${i+1}. ${esc(q[0])}</strong><div class="options">${['전혀 그렇지 않다','그렇지 않다','그렇다','매우 그렇다'].map((t,j)=>`<label class="opt"><input type="radio" name="q${i}" data-q="${i}" value="${j+1}" ${state.answers[i]===j+1?'checked':''}>${t}</label>`).join('')}</div></div>`).join('')}</div><div class="actions no-print"><button class="btn" id="finish1">STEP 1 결과 확인하기</button></div></section>${c?renderKoss(c):''}`}
function kossRadar(c){
 const cx=220,cy=218,R=145,n=c.scores.length;
 const pt=(i,v)=>{const a=-Math.PI/2+2*Math.PI*i/n;return [cx+R*(v/100)*Math.cos(a),cy+R*(v/100)*Math.sin(a)]};
 const points=arr=>arr.map((v,i)=>pt(i,v).map(x=>x.toFixed(1)).join(',')).join(' ');
 const grid=[25,50,75,100].map(v=>`<polygon points="${points(Array(n).fill(v))}" fill="none" stroke="#dbe4ef" stroke-width="1"/>`).join('');
 const axes=c.scores.map((d,i)=>{const [x,y]=pt(i,100);const [lx,ly]=pt(i,118);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#d7e1eb"/><text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="600" fill="#30455d">${d.name}</text>`}).join('');
 const high=points(c.scores.map(d=>d.ref[2]));const median=points(c.scores.map(d=>d.ref[1]));const mine=points(c.scores.map(d=>d.v));
 const dots=c.scores.map((d,i)=>{const [x,y]=pt(i,d.v);return `<circle cx="${x}" cy="${y}" r="4" fill="#1855a0" stroke="white" stroke-width="1.5"><title>${d.name}: ${fmt(d.v)}점</title></circle>`}).join('');
 return `<div class="radar-box"><h3>8개 영역 직무스트레스 비교 도표</h3><svg viewBox="0 0 440 440" role="img" aria-label="KOSS-SF1 8개 영역 레이더 도표. 파란색은 내 점수, 점선은 성별 참고치의 중앙값 및 상위 25퍼센트 기준" style="width:100%;max-width:520px;display:block;margin:auto;overflow:visible"><title>8개 영역별 KOSS-SF1 점수 비교</title>${grid}${axes}<polygon points="${high}" fill="#e38d6a" fill-opacity=".12" stroke="#c7774d" stroke-width="2" stroke-dasharray="7 5"/><polygon points="${median}" fill="#6a9e83" fill-opacity=".08" stroke="#55946d" stroke-width="2" stroke-dasharray="4 4"/><polygon points="${mine}" fill="#1e63b6" fill-opacity=".2" stroke="#1855a0" stroke-width="3"/>${dots}<text x="${cx+5}" y="${cy-R*.5-4}" font-size="10" fill="#718096">50</text><text x="${cx+5}" y="${cy-R*.75-4}" font-size="10" fill="#718096">75</text></svg><div class="radar-legend"><span><i style="background:#1855a0"></i>내 점수</span><span><i style="background:#55946d"></i>중앙값</span><span><i style="background:#c7774d"></i>상위 25% 기준</span></div><p class="small">각 축은 0~100점입니다. 점수가 높을수록 해당 직무스트레스 요인의 상대적 수준이 높습니다. 중앙값과 상위 25% 기준은 선택한 성별의 참고치입니다.</p></div>`;
}
function renderKoss(c){let top=[...c.scores].sort((a,b)=>({hi:2,mid:1,ok:0}[b.band]-{hi:2,mid:1,ok:0}[a.band])||b.v-a.v).slice(0,3);return `<section class="panel" id="koss-result"><div class="kicker">STEP 1 결과</div><h2>어떤 직무요인이 부담으로 나타났을까요?</h2><div class="grid"><div class="stat">총점<br><b>${fmt(c.total)}</b><br><span class="pill ${c.band}">${bandLabel(c.band)}</span></div><div class="stat">적용 참고치<br><b>${state.gender==='f'?'여성':'남성'}</b><br><span class="small">중앙값 ${fmt(c.ref[1])} · 상위25% ${fmt(c.ref[2])}</span></div></div><p class="small">영역별 점수가 높을수록 해당 스트레스 요인의 상대적 노출 수준이 높습니다. 8개 영역의 환산점수 평균이 총점입니다.</p>${kossRadar(c)}${c.scores.map(d=>`<div class="domain"><div class="domain-head"><strong>${d.name} <span class="pill ${d.band}">${bandLabel(d.band)}</span></strong><b>${fmt(d.v)}</b></div><div class="bar"><span style="width:${d.v}%"></span></div><div class="small">${d.p} · 중앙값 ${fmt(d.ref[1])} · 상위25% ${fmt(d.ref[2])}</div></div>`).join('')}<div class="note"><strong>우선 살펴볼 요인:</strong> ${top.map(d=>d.name).join(' · ')}<br>이는 개인의 잘못을 의미하지 않습니다. 작업조건과 조직적 개선 가능성을 함께 검토해야 합니다.</div><div class="actions no-print"><button class="btn secondary" id="edit1">응답 수정</button><button class="btn" id="next2">STEP 2 · DISC 집계 입력</button></div></section>`}
function render2(){let dc=discCalc();return `<section class="panel"><div class="kicker">STEP 2 · 종이 DISC 결과 입력</div><h2>종이 검사지의 최고치·최소치 집계값을 입력해 주세요</h2><p>강사가 제공한 종이 DISC 검사를 마친 후 <b>유형별 집계표</b>의 값을 입력합니다. 문항 원문은 웹사이트에 포함하지 않았습니다.</p><div class="note">최고치와 최소치의 합계는 각각 <b>28</b>이어야 합니다. N은 합계 확인에만 사용합니다. <b>차이점수 기반의 최상위 유형만</b> 보여드리며, 원본의 단계 환산표가 검증되지 않아 1~7단계 점수는 표시하지 않습니다.</div><table class="disc-table"><thead><tr><th>유형</th><th>최고치</th><th>최소치</th><th>차이</th></tr></thead><tbody>${['D','I','S','C','N'].map(t=>`<tr><td>${t}</td>${[0,1].map(i=>`<td><input type="number" min="0" max="28" inputmode="numeric" data-disc="${t}" data-i="${i}" value="${esc(state.disc[t][i])}" aria-label="${t} ${i===0?'최고치':'최소치'}"></td>`).join('')}<td>${dc.rows[t].diff??'—'}</td></tr>`).join('')}</tbody></table><div class="note ${dc.valid?'':'warn'}">${dc.valid?`합계 검증 완료: 최고치 ${dc.most}, 최소치 ${dc.least}. 최상위 차이점수 유형: <b>${dc.leaders.map(t=>t+'형').join(' · ')}</b>`:'모든 값을 입력하고 최고치·최소치 합계가 각각 28인지 확인해 주세요.'}</div><div class="actions no-print"><button class="btn secondary" id="back1">STEP 1 결과</button><button class="btn" id="next3">STEP 3 · 관리방법 찾기</button></div></section>${dc.valid?`<section class="panel"><h3>나의 DISC 차이점수</h3>${['D','I','S','C'].map(t=>`<div class="domain"><strong>${t}형 · ${typeInfo[t].name}</strong><span style="float:right">${dc.rows[t].diff>0?'+':''}${dc.rows[t].diff}</span><div class="small">${typeInfo[t].reflect}</div></div>`).join('')}<p class="small">DISC 유형은 자기성찰 참고자료이며 개인의 스트레스 반응이나 안전행동을 예측·진단하지 않습니다.</p></section>`:''}`}
function recs(c){let rank=[...c.scores].sort((a,b)=>({hi:2,mid:1,ok:0}[b.band]-{hi:2,mid:1,ok:0}[a.band])||b.v-a.v);let picked=state.situation!==''?domains[situationMap[Number(state.situation)]]:null;let chosen=picked?[picked,...rank.filter(x=>x.key!==picked.key)]:rank;return chosen.slice(0,3)}
function render3(){let c=calc(),dc=discCalc();if(!c||!dc.valid)return `<section class="panel">STEP 1·2를 완료해 주세요.<div class="actions"><button class="btn" id="back1">STEP 1로</button></div></section>`;let r=recs(c);let reactionHelp=['업무를 시작하기 전 잠시 멈춰 작업조건과 위험요인을 확인하고 우선순위를 정합니다.','감정이 격해졌을 때 즉시 지시하기보다 사실과 요구사항을 구분해 전달합니다.','말하기 어려운 문제를 짧은 문장으로 정리하고 신뢰할 수 있는 사람에게 도움을 요청합니다.','확인해야 할 핵심 기준을 정하고 필요한 의사결정 시점을 합의합니다.','도움을 요청한 경험을 바탕으로 필요한 지원을 구체화합니다.','현재 상황에서 도움이 되는 안전한 대응을 선택합니다.'];return `<section class="panel"><div class="kicker">STEP 3 · 나의 스트레스 관리방법 찾기</div><h2>나의 실제 상황과 반응을 함께 살펴봅니다</h2><p class="muted">추천은 KOSS 결과와 직접 선택한 상황을 우선 반영합니다. DISC는 대처법의 효과를 판정하는 기준으로 사용하지 않습니다.</p><div class="field no-print"><label for="situation">① 스트레스를 가장 많이 받는 상황</label><select id="situation"><option value="">선택해 주세요</option>${situations.map((s,i)=>`<option value="${i}" ${state.situation===String(i)?'selected':''}>${s}</option>`).join('')}</select></div><div class="field no-print"><label for="reaction">② 그 상황에서 실제 나의 반응</label><select id="reaction"><option value="">선택해 주세요</option>${reactions.map((s,i)=>`<option value="${i}" ${state.reaction===String(i)?'selected':''}>${s}</option>`).join('')}</select></div><div class="actions no-print"><button class="btn" id="update3">추천 결과 확인하기</button></div>${state.situation!==''&&state.reaction!==''?`<div id="recs"><h3>나의 스트레스 반응 분석</h3><div class="note">선택한 상황: <b>${esc(situations[Number(state.situation)])}</b><br>스스로 인식한 반응: <b>${esc(reactions[Number(state.reaction)])}</b><br><b>실천 제안:</b> ${reactionHelp[Number(state.reaction)]}<div class="small">출처 분류: 안전행동 및 의사소통의 일반 원칙을 바탕으로 한 교육용 재구성. 개인별 효과가 검증된 처방이 아닙니다.</div></div><h3>개인 차원의 실천방법</h3>${r.map((d,i)=>`<div class="rec"><h4>${i+1}. ${d.name} · ${d.p}</h4><p>${d.individual}</p><div class="source">근거 범주: WHO(2022), NICE NG212의 직장 정신건강·관리자 지원 원칙을 바탕으로 교육용 재구성 · KOSS 해당 영역: ${d.name} (${fmt(d.v)}점, ${bandLabel(d.band)})</div></div>`).join('')}<h3>조직 차원의 개선방안</h3>${r.map((d,i)=>`<div class="rec"><h4>${i+1}. ${d.name} 관련 작업조건 개선</h4><p>${d.org}</p><div class="source">근거 범주: WHO·ILO(2022) 직장 정신건강 정책보고서, NICE NG212의 조직적 개입 원칙 · 구체적 문구는 교육용 재구성</div></div>`).join('')}<div class="note warn">개인적 대처만으로 해결할 수 없는 문제는 관리자와 조직이 작업조건을 개선해야 합니다. 4주 실천계획은 프로그램에서 제안한 교육용 일정이며 KOSHA GUIDE의 원문 계획을 그대로 인용한 것이 아닙니다.</div><h3>4주 실천계획 예시</h3><div class="plan">${[['1주차','주요 스트레스 요인과 작업조건 기록'],['2주차','관리자·동료와 필요한 지원 논의'],['3주차','조정된 업무·작업환경 개선방안 실행'],['4주차','실천 결과 점검 및 추가 개선과제 정리']].map(x=>`<div><b>${x[0]}</b><br>${x[1]}</div>`).join('')}</div><div class="actions no-print"><button class="btn" id="next4">STEP 4 · 동료 이해와 관리감독자 실천</button></div></div>`:''}</section>`}
function render4(){let c=calc(),dc=discCalc();if(!c||!dc.valid||state.situation===''||state.reaction==='')return `<section class="panel">STEP 1~3을 완료해 주세요.<div class="actions"><button class="btn" id="back3">STEP 3으로</button></div></section>`;let top=recs(c),types=dc.leaders;return `<section class="panel"><div class="kicker">STEP 4 · 동료와 서로 이해하기</div><h2>관리감독자의 소통과 안전관리로 연결하기</h2><div class="note">DISC는 사람을 단정하거나 배치·평가하는 도구로 사용하지 않습니다. 유형별 제안은 일반적인 소통 원칙을 자기성찰 활동에 적용한 것입니다.</div><h3>DISC 유형별 소통 참고카드</h3><div class="typecards">${Object.entries(typeInfo).map(([k,v])=>`<div class="typecard ${types.includes(k)?'active':''}"><h4>${k}형 · ${v.name}${types.includes(k)?' · 내 최상위 유형':''}</h4><p>${v.reflect}</p><p><b>대화 시 참고:</b> ${v.talk}</p></div>`).join('')}</div><h3>관리감독자 실천 체크리스트</h3>${['근로자의 업무량·작업시간·휴식이 적정한지 확인합니다.','작업기준과 변경사항을 명확하게 전달하고 이해 여부를 확인합니다.','근로자가 위험요인과 고충을 불이익 걱정 없이 말할 수 있게 합니다.','위험한 작업은 중지·보고·개선하도록 지원합니다.','필요한 인력·장비·교육 등 조직적 개선을 요청하고 조치 결과를 확인합니다.'].map(s=>`<div class="rec">☐ ${s}</div>`).join('')}<div class="field"><label for="commit">내가 실천할 행동 한 가지</label><textarea id="commit" placeholder="예: 매주 작업회의에서 작업량과 위험요인을 함께 확인한다">${esc(state.commit)}</textarea></div><div class="field"><label for="request">조직에 요청할 개선사항 한 가지</label><textarea id="request" placeholder="예: 작업시간 계획에 안전점검과 준비시간을 반영한다">${esc(state.request)}</textarea></div><div class="actions no-print"><button class="btn secondary" id="back3">STEP 3으로</button><button class="btn" id="print">전체 결과 인쇄 / PDF 저장</button></div></section><section class="panel print-only"><h2>STEP 1 · KOSS-SF1 결과</h2>${renderKoss(c)}</section><section class="panel print-only"><h2>STEP 2 · DISC 차이점수</h2>${Object.entries(dc.rows).map(([t,v])=>`<div>${t} : 최고치 ${v.most}, 최소치 ${v.least}, 차이 ${v.diff??'해당 없음'}</div>`).join('')}</section><section class="panel print-only"><h2>STEP 3 · 관리방법</h2><p>스트레스 상황: ${esc(situations[Number(state.situation)])} / 실제 반응: ${esc(reactions[Number(state.reaction)])}</p>${top.map(d=>`<div class="rec"><b>${d.name} (${fmt(d.v)}점)</b><p>개인: ${d.individual}</p><p>조직: ${d.org}</p></div>`).join('')}<h3>4주 실천계획(교육용 예시)</h3><p>1주차 기록 → 2주차 지원 논의 → 3주차 개선 실행 → 4주차 평가·보완</p></section><section class="panel"><h3>참고문헌 및 근거 구분</h3><div class="sources"><p>① KOSHA GUIDE E-G-2-2025, 별표 3(KOSS-SF1 문항), 별표 4(성별 참고치): STEP 1 문항·평가 근거.</p><p>② WHO (2022), <i>Guidelines on Mental Health at Work</i>: 조직·관리자·개인적 개입의 일반 근거. https://www.who.int/publications/i/item/9789240053052</p><p>③ WHO & ILO (2022), <i>Mental Health at Work: Policy Brief</i>: 조직 차원의 예방 및 작업환경 개선 근거. https://www.who.int/publications/i/item/9789240057944</p><p>④ NICE (2022), <i>Mental Wellbeing at Work</i> (NG212): 조직적 지원·관리자 소통 관련 권고. https://www.nice.org.uk/guidance/ng212</p><p>⑤ DISC 종이 검사지: 교육생 별도 실시·집계. 웹사이트에 검사지 문항은 포함하지 않음. DISC 유형별 소통 문구, 개인별 추천 및 4주 일정은 위 일반 원칙을 참고한 교육용 재구성이며 유형별 효과가 검증된 것은 아님.</p></div><div class="note warn">본 결과는 자기점검과 교육 목적이며 진단이 아닙니다. 성별 참고치는 KOSHA GUIDE의 집단 참고치입니다. 결과의 높고 낮음만으로 질병이나 치료 필요성을 판단하지 마세요.</div><div class="actions no-print"><button class="btn secondary" id="reset">처음부터 새로 시작</button></div></section>`}
function bind(){let gender=$('#gender');if(gender)gender.onchange=e=>{state.gender=e.target.value;render()};let role=$('#role');if(role)role.onchange=e=>{state.role=e.target.value};document.querySelectorAll('[data-q]').forEach(x=>x.onchange=e=>{state.answers[+e.target.dataset.q]=+e.target.value;let p=$('.progress div');if(p)p.style.width=state.answers.filter(x=>x!==null).length/26*100+'%';let sm=$('.progress+p');if(sm)sm.textContent='응답 '+state.answers.filter(x=>x!==null).length+' / 26문항'});document.querySelectorAll('[data-disc]').forEach(x=>x.onchange=e=>{state.disc[e.target.dataset.disc][+e.target.dataset.i]=e.target.value;render()});let s=$('#situation');if(s)s.onchange=e=>state.situation=e.target.value;let r=$('#reaction');if(r)r.onchange=e=>state.reaction=e.target.value;let commit=$('#commit');if(commit)commit.oninput=e=>state.commit=e.target.value;let request=$('#request');if(request)request.oninput=e=>state.request=e.target.value;function click(id,fn){let el=$('#'+id);if(el)el.onclick=fn}click('finish1',()=>{let i=state.answers.findIndex(v=>v===null);if(i!==-1){alert('미응답 문항이 있습니다: '+(i+1)+'번');$('#q'+i)?.scrollIntoView({behavior:'smooth',block:'center'});return}render();$('#koss-result')?.scrollIntoView({behavior:'smooth'})});click('edit1',()=>window.scrollTo({top:0,behavior:'smooth'}));click('next2',()=>move(1));click('back1',()=>move(0));click('next3',()=>{if(!discCalc().valid){alert('최고치·최소치의 모든 값을 입력하고 합계를 각각 28로 맞춰 주세요.');return}move(2)});click('update3',()=>{if(state.situation===''||state.reaction===''){alert('상황과 실제 반응을 모두 선택해 주세요.');return}render();$('#recs')?.scrollIntoView({behavior:'smooth'})});click('next4',()=>move(3));click('back3',()=>move(2));click('print',()=>{if($('#commit'))state.commit=$('#commit').value;if($('#request'))state.request=$('#request').value;window.print()});click('reset',()=>{if(confirm('모든 응답을 지우고 다시 시작하시겠습니까?'))location.reload()})}
render();
</script></body></html>
