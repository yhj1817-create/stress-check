<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>직무스트레스 4단계 점검</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 교육생 휴대폰용 단일 컬럼(최대 780px). 상단 고정 STEP 표시줄 + 단계별 카드. 안전블루(DISC 원본) 계열을 공통 디자인으로 사용 */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF3F9; --surface:#FFFFFF; --surface-2:#F4F7FB; --ink:#0E1E35; --muted:#55657C; --line:#D3DDEA;
  --accent:#1B5BB8; --accent-strong:#0B3D8C; --accent-soft:#E2ECFA; --on-accent:#FFFFFF;
  --warn:#B4441F; --warn-soft:#FBE7DD; --mid:#A8780C; --mid-soft:#FBF1D6; --ok:#23784A; --ok-soft:#E2F1E3;
  --d:#C4402F; --i:#C98A06; --s:#23874F; --c:#2563C9;
  --band:#F3F6FB; --band-2:#FFFFFF;
  --font-display:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1524; --surface:#132036; --surface-2:#182842; --ink:#E8EEF7; --muted:#9DB0C9; --line:#2A3D5C;
  --accent:#5D9BF0; --accent-strong:#8BB8F7; --accent-soft:#1B3358; --on-accent:#0A1424;
  --warn:#F0916C; --warn-soft:#3A2119; --mid:#E9B949; --mid-soft:#3A2F14; --ok:#5BC48A; --ok-soft:#16352A;
  --d:#EE7A6B; --i:#F0BC4A; --s:#5CC98B; --c:#6FA2F2;
  --band:#16253D; --band-2:#132036; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0C1524; --surface:#132036; --surface-2:#182842; --ink:#E8EEF7; --muted:#9DB0C9; --line:#2A3D5C;
  --accent:#5D9BF0; --accent-strong:#8BB8F7; --accent-soft:#1B3358; --on-accent:#0A1424;
  --warn:#F0916C; --warn-soft:#3A2119; --mid:#E9B949; --mid-soft:#3A2F14; --ok:#5BC48A; --ok-soft:#16352A;
  --d:#EE7A6B; --i:#F0BC4A; --s:#5CC98B; --c:#6FA2F2;
  --band:#16253D; --band-2:#132036; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:90px}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;line-height:1.3;margin:0}
h1{font-size:clamp(1.6rem,5vw,2.2rem);font-weight:700}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
ul{margin:0;padding-left:1.15em}
li+li{margin-top:4px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:3px solid var(--accent)}
.top-in{max-width:780px;margin:0 auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.top-row b{color:var(--accent-strong)}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stp{font:inherit;font-family:var(--font-display);font-size:.78rem;font-weight:600;line-height:1.25;min-height:44px;padding:4px 6px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--muted);cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:center}
.stp small{font-weight:500;font-size:.72rem}
.stp.done{border-color:var(--accent);color:var(--accent-strong)}
.stp.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stp:disabled{opacity:.55;cursor:not-allowed}
.wrap{max-width:780px;margin:0 auto;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.kicker{font-size:.8rem;letter-spacing:.06em;color:var(--muted);font-weight:500}
.q-big{font-family:var(--font-display);font-weight:600;color:var(--accent-strong)}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.btn{font:inherit;font-family:var(--font-display);font-weight:600;font-size:1.02rem;min-height:52px;padding:10px 20px;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent-strong)}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;box-sizing:border-box}
.steps4 .later{opacity:.5}
.steps4 .later span::after{content:" · 다음 QR"}
.codebox{display:flex;flex-direction:column;gap:8px}
.codebox .code{font-family:var(--f-num,monospace);font-size:14px;background:var(--band,transparent);border:1px dashed var(--accent);border-radius:8px;padding:10px;word-break:break-all;user-select:all;margin:0}
.codein{font:inherit;font-family:var(--f-num,monospace);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;min-height:48px;padding:8px 12px;width:100%;box-sizing:border-box;text-transform:uppercase}
.loaded{border-left:4px solid var(--ok);padding:8px 12px;background:var(--ok-soft);border-radius:8px}
.qrgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.qrbox{background:#fff;border-radius:12px;padding:10px;width:100%;max-width:260px;margin:0 auto;box-sizing:border-box}
.qrbox svg{width:100%;height:auto;display:block}
.qrurl{font-size:12px;color:var(--muted);word-break:break-all;margin:0}
.qrfull{position:fixed;inset:0;z-index:60;background:#fff;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center}
.qrfull h2{color:#111;font-size:clamp(1.4rem,4vw,2.4rem);margin:0}
.qrfull .qrbox{max-width:min(70vh,88vw)}
.qrfull button{font:inherit;font-weight:600;min-height:48px;padding:8px 22px;border-radius:10px;border:2px solid #1B5BB8;background:#fff;color:#1B5BB8}
.linkish{font:inherit;background:none;border:0;padding:0;color:var(--accent-strong);text-decoration:underline;cursor:pointer}
.dctbl td{vertical-align:middle}
.dcin{font:inherit;font-family:var(--f-num,monospace);font-size:1.15rem;text-align:center;width:4.2em;min-height:48px;padding:6px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;box-sizing:border-box}
.dcin:focus{outline:3px solid var(--accent);outline-offset:1px}
.dcin.bad{border-color:var(--warn)}
.sum-ok{color:var(--ok)!important;font-weight:700}
.sum-ok::after{content:" ✓"}
.dcin{-moz-appearance:textfield;appearance:textfield}
.dcin::-webkit-outer-spin-button,.dcin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ev{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid currentColor;vertical-align:middle;white-space:nowrap;margin-left:4px}
.ev.g{color:var(--ok)}.ev.r{color:var(--accent-strong)}.ev.s{color:var(--muted)}
.evsrc{display:block;font-size:.8rem;color:var(--muted);margin:2px 0 6px}
.evlegend{display:grid;gap:6px;font-size:.86rem;margin:0;padding:0;list-style:none}
.evlegend li{display:flex;gap:8px;align-items:baseline}
.evlegend .ev{margin-left:0;flex:none}
.sel{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;min-height:48px;padding:8px 12px;width:100%;box-sizing:border-box;margin:4px 0 10px}
.chg-up{color:var(--warn);font-weight:700}
.chg-dn{color:var(--ok);font-weight:700}
.legend .old{background:none;border:2px dashed var(--muted)}

.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.pick:focus-visible,.jump:focus-visible,.stp:focus-visible,.tab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row .btn{flex:1 1 180px}
.steps4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;counter-reset:s}
.steps4 div{background:var(--surface-2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.steps4 b{font-family:var(--font-display);color:var(--accent-strong)}
.steps4 span{font-size:.88rem;color:var(--muted)}
.steps4 em{font-style:normal;font-size:.92rem;font-weight:500}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-width:0}
legend{font-weight:600;padding:0;margin-bottom:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label,.opt label{position:relative}
.seg input,.opt input{position:absolute;opacity:0;inset:0;margin:0}
.seg span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:52px;padding:6px 10px;border:2px solid var(--line);border-radius:10px;background:var(--surface-2);font-weight:500;cursor:pointer}
.seg input:checked+span,.opt input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg input:focus-visible+span,.opt input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
input[type=date],textarea{font:inherit;width:100%;min-height:50px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.err{color:var(--warn);font-size:.88rem;font-weight:500}
.notice{background:var(--accent-soft);border-radius:10px;padding:12px 16px;font-size:.92rem}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:12px 16px;font-weight:500}
.disclaim{border-left:4px solid var(--accent);padding:10px 14px;background:var(--surface-2);border-radius:0 10px 10px 0;font-size:.92rem}
/* KOSS 문항 */
.q{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);gap:10px}
.q.missing{border-color:var(--warn);background:var(--warn-soft)}
.q-head{display:flex;gap:10px;align-items:flex-start;float:left;width:100%;padding:0;margin:0 0 10px}
.q .opt,.q .q-miss{clear:both}
.q-no{font-family:var(--font-mono);font-weight:500;color:var(--accent-strong);flex:none;padding-top:1px}
.q-dom{display:block;font-size:.76rem;color:var(--muted);font-weight:500;letter-spacing:.03em}
.opt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opt span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:52px;padding:4px;border:2px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:.86rem;line-height:1.3;cursor:pointer}
.q-miss{display:none;color:var(--warn);font-size:.86rem;font-weight:500}
.q.missing .q-miss{display:block}
.bar{flex:1;height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s}
.prog{display:flex;align-items:center;gap:12px}
.prog b{font-family:var(--font-display);font-variant-numeric:tabular-nums;min-width:4.5em;text-align:right}
/* DISC 문항 */
.qhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.qnum{font-family:var(--font-display);font-size:1.5rem;font-weight:700;color:var(--accent-strong);font-variant-numeric:tabular-nums}
.words{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center}
.words .h{font-size:.82rem;color:var(--muted);text-align:center;letter-spacing:.03em}
.word{font-size:1.2rem;font-weight:500;padding:6px 0;min-width:0}
.pick{font:inherit;font-family:var(--font-display);font-weight:600;min-width:80px;min-height:52px;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);color:var(--muted);cursor:pointer;font-size:1rem}
.pick.most.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pick.least.on{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.wordrow-sep{grid-column:1/-1;border-top:1px solid var(--line)}
.grid28{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}
.jump{font:inherit;font-size:.8rem;font-variant-numeric:tabular-nums;min-height:34px;padding:0;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.jump.done{background:var(--accent-soft);color:var(--accent-strong);border-color:transparent;font-weight:700}
.jump.cur{outline:2px solid var(--accent);outline-offset:1px}
.jump.miss{border-color:var(--warn);color:var(--warn);font-weight:700}
/* 결과 공통 */
.pill{display:inline-block;font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:999px;vertical-align:middle;white-space:nowrap}
.pill.hi{background:var(--warn-soft);color:var(--warn)}
.pill.mid{background:var(--mid-soft);color:var(--mid)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.score-hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{width:108px;height:108px;flex:none}
.ring text{fill:var(--ink);font-family:var(--font-display)}
.score-hero .t{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
#radar{width:100%;height:auto;display:block;max-width:560px;margin:0 auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.dom{display:flex;flex-direction:column;gap:12px}
.dom-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.dom-row .nm{font-weight:600}
.dom-row .val{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.zones{grid-column:1/-1;position:relative;display:flex;height:10px;border-radius:999px;overflow:hidden}
.zones i{display:block;height:100%}
.z-ok{background:var(--ok-soft)} .z-mid{background:var(--mid-soft)} .z-hi{background:var(--warn-soft)}
.zones b{position:absolute;top:-2px;width:4px;height:14px;margin-left:-2px;background:var(--ink);border-radius:2px}
.dom-row .desc{grid-column:1/-1;font-size:.84rem;color:var(--muted)}
.hero{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.badge{font-family:var(--font-display);font-weight:700;font-size:2.4rem;line-height:1;min-width:84px;height:84px;padding:0 14px;border-radius:16px;display:grid;place-items:center;color:#fff}
.hero .t{flex:1;min-width:200px;display:flex;flex-direction:column;gap:4px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:.84rem;color:var(--muted);font-weight:500}
td.type{font-family:var(--font-display);font-weight:700;text-align:left;white-space:nowrap}
td.type .tn{font-weight:500;color:var(--muted);font-size:.9em}
tr.top td{background:var(--accent-soft)}
.dotc{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
svg text{font-family:var(--font-body)}
.sec{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.sec>div{background:var(--surface-2);border-radius:10px;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:6px}
.sec h3{font-size:.98rem}
.sec .wide{grid-column:1/-1}
.typeblock{display:flex;flex-direction:column;gap:12px}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--surface)}
details>summary{cursor:pointer;font-family:var(--font-display);font-weight:600;color:var(--accent-strong);min-height:32px;display:flex;align-items:center}
details[open]>summary{margin-bottom:10px}
/* STEP 3 */
.map{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.map>div{background:var(--surface-2);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.map .x{display:grid;place-items:center;font-family:var(--font-display);font-size:1.4rem;color:var(--muted);background:none;padding:0}
.picks{display:flex;flex-direction:column;gap:8px}
.pickgrp{display:flex;flex-direction:column;gap:6px}
.pickgrp h3{font-size:.92rem;color:var(--muted);font-weight:600}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.chk input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--accent)}
.chk.on{border-color:var(--accent);background:var(--accent-soft)}
.chk .tag{font-size:.74rem;font-weight:700;color:var(--muted);display:block}
.actcard{border:2px dashed var(--accent);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.actcard ol{margin:0;padding-left:1.3em}
.plan{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.plan li{display:grid;grid-template-columns:8.5em 1fr;gap:4px 12px;padding:10px 12px;background:var(--surface-2);border-radius:10px;margin:0}
.plan .pd{font-family:var(--font-mono);font-size:.84rem;color:var(--accent-strong);font-weight:500}
.plan .how{grid-column:2;font-size:.84rem;color:var(--muted)}
.who{font-weight:700;font-size:.9rem;margin-top:4px}
.goal{padding-left:1.15em}
.prog6{display:flex;flex-direction:column;gap:12px}
.prog6 .st{display:grid;grid-template-columns:28px 1fr;gap:10px}
.prog6 .no{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.prog6 .stage{font-size:.78rem;color:var(--accent-strong);font-weight:700}
.prog6 .body{display:flex;flex-direction:column;gap:4px;min-width:0}
.note{font-size:.86rem;color:var(--muted)}
/* STEP 4 */
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{font:inherit;font-family:var(--font-display);font-weight:600;min-height:46px;padding:6px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.tab.on{color:var(--ink);border-color:currentColor;background:var(--surface-2)}
.types4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.types4>div{border-radius:10px;padding:12px 14px;background:var(--surface-2);border-top:4px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.types4 b{font-family:var(--font-display)}
.types4 .mine{font-size:.74rem;font-weight:700;color:var(--accent-strong)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair>div{background:var(--surface-2);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.six{counter-reset:k;list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.six li{counter-increment:k;margin:0;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--surface-2);border-radius:10px}
.six li::before{content:counter(k);flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.memo{display:flex;flex-direction:column;gap:10px}
.memo label{font-weight:600;font-size:.94rem}
.help{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem}
.help b{font-family:var(--font-mono);color:var(--accent-strong)}

// [통합본 수정 2026-10-31, 혜진님 승인] 소수 오차 때문에 x.x5가 내려가던 문제를 가이드 방식(반올림)으로 보정
const r1=v=>Math.round(Number((v*10).toFixed(6)))/10;
const f1=v=>r1(v).toFixed(1);
function score(){
  // 응답(1~4) → 점수(역채점 반영) → 영역별 100점 환산: (합계-문항수)/(문항수×3)×100, 총점=8개 영역 평균
  const pts=S.ans.map((a,i)=>Q[i].r?5-a:a);
  const g=S.gender||"m";
  const ds=D.map(d=>{const n=d.items.length,sum=d.items.reduce((s,i)=>s+pts[i],0);const v=r1((sum-n)/(3*n)*100);const ref=d.ref[g];return{...d,v,ref,lv:level(v,ref),band:band(v,ref)}});
  const total=r1(ds.reduce((s,d)=>s+d.v,0)/ds.length);
  const tref=CFG.total[g];
  return{ds,total,tref,tlv:level(total,tref),tband:band(total,tref)};
}
function priorities(ds){
  const hi=ds.filter(d=>d.lv==="hi").sort((a,b)=>(b.v-b.ref[2])-(a.v-a.ref[2]));
  const mid=ds.filter(d=>d.lv==="mid").sort((a,b)=>(b.v-b.ref[1])-(a.v-a.ref[1]));
  const ok=ds.filter(d=>d.lv==="ok").sort((a,b)=>(b.v-b.ref[2])-(a.v-a.ref[2]));
  return{hi,mid,list:[...hi,...mid,...ok]};
}

// 8각형: 참고치 구간을 색 띠로(안쪽 초록=정상, 노랑=경계, 바깥 빨강=고위험), 하위25% 경계는 점선
function radarSVG(ds,P){
  P=P||{line:"var(--line)",muted:"var(--muted)",ink:"var(--ink)",acc:"var(--accent)",warn:"var(--warn)",mid:"var(--mid)",okS:"var(--ok-soft)",midS:"var(--mid-soft)",hiS:"var(--warn-soft)",surf:"var(--surface)"};
  const W=500,H=420,cx=W/2,cy=H/2+4,R=140,n=ds.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100]};
  const poly=vals=>vals.map((v,i)=>pt(i,v).map(x=>x.toFixed(1)).join(",")).join(" ");
  let g="";
  g+=`<polygon points="${poly(Array(n).fill(100))}" fill="${P.hiS}" stroke="none"/>`;
  g+=`<polygon points="${poly(ds.map(d=>d.ref[2]))}" fill="${P.midS}" stroke="${P.warn}" stroke-width="1.5" stroke-dasharray="5 3"/>`;
  g+=`<polygon points="${poly(ds.map(d=>d.ref[1]))}" fill="${P.okS}" stroke="${P.mid}" stroke-width="1.2" stroke-dasharray="4 3"/>`;
  g+=`<polygon points="${poly(ds.map(d=>d.ref[0]===null?0.5:d.ref[0]))}" fill="none" stroke="${P.muted}" stroke-width="1" stroke-dasharray="1.5 3"/>`;
  [25,50,75,100].forEach(l=>{g+=`<polygon points="${poly(Array(n).fill(l))}" fill="none" stroke="${P.line}" stroke-width="1" opacity=".9"/>`});
  ds.forEach((d,i)=>{const[x,y]=pt(i,100);g+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${P.line}" stroke-width="1"/>`});
  [50,100].forEach(l=>{g+=`<text x="${cx+4}" y="${(cy-R*l/100+12).toFixed(1)}" font-size="10" fill="${P.muted}" font-family="IBM Plex Mono,monospace">${l}</text>`});
  g+=`<polygon points="${poly(ds.map(d=>Math.max(d.v,2)))}" fill="${P.acc}" fill-opacity=".18" stroke="${P.acc}" stroke-width="2.8" stroke-linejoin="round"/>`;
  ds.forEach((d,i)=>{const[x,y]=pt(i,Math.max(d.v,2));g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="${d.lv==="hi"?P.warn:d.lv==="mid"?P.mid:P.acc}" stroke="${P.surf}" stroke-width="1.5"/>`});
  ds.forEach((d,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;const c=Math.cos(a);const lx=cx+c*(R+22),ly=cy+Math.sin(a)*(R+20)+(Math.sin(a)>0.5?8:0);const anchor=Math.abs(c)<.2?"middle":(c>0?"start":"end");
    const col=d.lv==="hi"?P.warn:d.lv==="mid"?P.mid:P.ink;
    g+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}" font-size="14" font-weight="600" fill="${col}" font-family="IBM Plex Sans KR,sans-serif">${d.k}</text><text x="${lx.toFixed(1)}" y="${(ly+16).toFixed(1)}" text-anchor="${anchor}" font-size="12" fill="${P.muted}" font-family="IBM Plex Mono,monospace">${f1(d.v)} · ${LV[d.lv]}</text>`});
  return `<svg id="radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="8개 영역 직무스트레스 점수와 참고치 구간 8각형 도표">${g}</svg>`;
}
function rangeTxt([a,b,d]){
  return[a===null?"-":f1(a)+" 이하", a===null?f1(b)+" 이하":f1(a+0.1)+"~"+f1(b), f1(b+0.1)+"~"+f1(d-0.1), f1(d)+" 이상"];
}

// 개인 맞춤 예방 프로그램 (KOSHA GUIDE 직무스트레스 예방 프로그램 업무 흐름도 단계 적용)
function program(R){
  const {ds,total,tref,tlv}=R; const P=priorities(ds);
  const top=P.list.slice(0,Math.max(1,Math.min(3,P.hi.length+P.mid.length)||2));
  const focus=top.length?top:P.list.slice(0,2);
  const d0=S.date||todayKST(), sup=S.role==="s";
  const refer = tlv==="hi" || P.hi.length>=3;
  const weeks=[0,7,14,21,28].map(n=>addDays(d0,n));
  const rows=[];
  rows.push([fmtD(weeks[0])+"~"+fmtD(addDays(d0,6)),`[${focus[0].k}] ${TIPS[focus[0].k].me[0]}`,"매일 1회, 실천 여부를 달력에 체크"]);
  rows.push([fmtD(weeks[1])+"~"+fmtD(addDays(d0,13)),`[${focus[0].k}] ${sup?TIPS[focus[0].k].org[0]:"관리감독자와 10분 면담: "+TIPS[focus[0].k].org[0]}`,sup?"팀 회의 안건으로 올리고 담당자·기한 정하기":"점검 결과 중 영역 이름만 공유하고 개선 요청"]);
  if(focus[1]) rows.push([fmtD(weeks[2])+"~"+fmtD(addDays(d0,20)),`[${focus[1].k}] ${TIPS[focus[1].k].me[0]}`,focus[2]?`함께: [${focus[2].k}] ${TIPS[focus[2].k].me[0]}`:"주 3회 이상 실천"]);
  else rows.push([fmtD(weeks[2])+"~"+fmtD(addDays(d0,20)),`[${focus[0].k}] ${TIPS[focus[0].k].me[1]||TIPS[focus[0].k].me[0]}`,"주 3회 이상 실천"]);
  rows.push([fmtD(weeks[3])+"~"+fmtD(addDays(d0,27)),"퇴근 전 5분 목·어깨 스트레칭과 4초 들숨·6초 날숨 호흡","매일, 스트레스 관리 기본 습관"]);
  rows.push([fmtD(weeks[4]),"같은 점검을 다시 하고 8각형 비교 (평가·피드백)","1순위 영역 점수 변화와 실천율 확인"]);
  const goals=[
    `4주 뒤(${fmtD(weeks[4])}) 재점검에서 1순위 [${focus[0].k}] 점수를 ${focus[0].lv==="hi"?"고위험 기준 "+f1(focus[0].ref[2])+"점 미만":"중앙값 "+f1(focus[0].ref[1])+"점 이하"}으로 낮추기 (현재 ${f1(focus[0].v)}점)`,
    `계획한 실천 항목을 4주 동안 주 3회 이상 실행하기`,
    tlv==="ok"?`총점 ${f1(total)}점을 정상 범위(중앙값 ${f1(tref[1])}점 이하)로 유지하기`:`총점 ${f1(total)}점을 ${tlv==="hi"?"고위험 기준 "+f1(tref[2])+"점 미만":"중앙값 "+f1(tref[1])+"점 이하"}으로 낮추기`
  ];
  const steps=[
   {stage:"유해요인 평가",title:"나의 위험 영역 확인",html:`<p>고위험 ${P.hi.length}개 영역${P.hi.length?" ("+P.hi.map(d=>d.k).join(", ")+")":""}, 경계 ${P.mid.length}개 영역${P.mid.length?" ("+P.mid.map(d=>d.k).join(", ")+")":""}. 총점은 ${f1(total)}점으로 <b>${LV[tlv]}</b> 수준입니다.</p>`},
   {stage:"우선순위 설정",title:"먼저 다룰 영역",html:`<ul>${focus.map((d,i)=>`<li><b>${i+1}순위 ${d.k}</b> ${f1(d.v)}점 · ${LV[d.lv]} <span class="note">(상위25% 기준 ${f1(d.ref[2])})</span></li>`).join("")}</ul>`},
   {stage:"목표 설정",title:"4주 목표",html:`<ul class="goal">${goals.map(t=>`<li>${t}</li>`).join("")}</ul>`},
   {stage:"세부 실행계획 수립",title:"주차별 실행계획",html:`<ul class="plan-list">${rows.map(r=>`<li><span class="pd">${r[0]}</span><span>${esc(r[1])}</span><span class="note">방법: ${esc(r[2])}</span></li>`).join("")}</ul>`},
   {stage:"예방 프로그램 실행",title:"함께 쓸 수 있는 자원",html:`<p class="who">개인 차원</p><ul><li>예방교육 참여, 근골격계 스트레칭·호흡 등 스트레스 관리 습관</li>${focus.map(d=>`<li>${d.k}: ${TIPS[d.k].me[1]||TIPS[d.k].me[0]}</li>`).join("")}</ul>
     <p class="who">조직 차원 (관리감독자·회사에 요청)</p><ul>${focus.map(d=>`<li>${d.k}: ${TIPS[d.k].org[0]}</li>`).join("")}</ul>
     <p class="who">상담·외부 자원</p><ul><li>${refer?"<b>고위험 신호가 있어 전문 상담을 먼저 권합니다.</b> ":""}근로자건강센터(안전보건공단, 무료 직무스트레스 상담)</li><li>직업트라우마센터(사고·폭언 등 충격 경험 시), 지역 정신건강복지센터</li></ul>`},
   {stage:"평가 및 피드백",title:"4주 뒤 다시 점검",html:`<p>${fmtD(weeks[4])}에 같은 점검을 다시 해서 1순위 영역 점수와 실천율을 비교하세요. 잘 안 된 항목은 이유를 적고 다음 4주 계획에 반영합니다.</p>`}
  ];
  if(sup) steps.push({stage:"관리감독자 추가 과제",title:"우리 팀 예방 프로그램으로 넓히기",html:`<ul><li><b>추진팀 구성:</b> 팀 안에서 직무스트레스 담당자 1명과 보건관리자를 연결하기</li><li><b>요구도 조사:</b> 팀원이 원하는 프로그램(상담, 교육, 업무조정 등)과 참여 의사를 간단히 묻기</li><li><b>우선순위·목표:</b> 팀 공통으로 높게 나온 영역을 정하고 '고위험군 비율 감소, 프로그램 참여율 증가'를 목표로 삼기</li><li><b>예방 정책:</b> 안전보건관리규정에 직무스트레스 예방 내용을 넣도록 건의하기</li></ul>`});
  return{steps,focus,goals,rows,refer};
}

/* ===== 2. 단계 환산표 (유형별 집계표 하단 그래프) =====
   각 배열 = 7단계, 6단계, 5단계, 4단계, 3단계, 2단계의 '최소 점수'. 이보다 낮으면 1단계.
   I형 7단계: 원본 인쇄 +6 (6단계 +5~+9와 겹침) → 사용자 확인 대기 중, 임시로 +10 적용 */
const I_STAGE7_MIN = 10; // [2026-10-31 혜진님 확인] 6단계가 +5~+9이므로 7단계는 +10 이상 (인쇄값 +6은 6단계와 겹침)
const STAGE_MIN = {
  D: [6, 1, -2, -5, -8, -11],
  I: [I_STAGE7_MIN, 5, 2, -1, -5, -9],
  S: [11, 8, 5, 2, -1, -4],
  C: [11, 7, 4, 1, -2, -6]
};
const TYPES = ["D","I","S","C"];
const TYPE_NAME = {D:"주도형",I:"사교형",S:"안정형",C:"신중형"};

/* ===== 3. 채점 ===== */
function toStage(type, score){
  const mins = STAGE_MIN[type];
  for (let k = 0; k < mins.length; k++) if (score >= mins[k]) return 7 - k;
  return 1;
}

function drawStageChart(r){

}function drawBarChart(r){
  const W = chartW(), rowH = 54, T = 16, B = 30, L = W < 500 ? 92 : 120, R = 30;
  const H = T + B + rowH * 4;

/* 결과 코드: [성별][KOSS판]-[문항점수 26자리(원본 KOSS 결과 코드와 같음)]-[역할 W/S][DISC 최고 D·I·S·C, 최소 D·I·S·C 개수 8자리(36진수)]-[점검일 YYMMDD]. 이름 없음 */
const B36="0123456789ABCDEFGHIJKLMNOPQRS";
function makeCode(g,r,d,k,dd){return(g==="f"?"F":"M")+CFG.letter+"-"+k.map((a,i)=>Q[i].r?5-a:a).join("")+"-"+(r==="s"?"S":"W")+(dd?dd.map(v=>B36[v]).join(""):"")+"-"+String(d||"").slice(2).replace(/-/g,"")}
function curCode(){return makeCode(ST.gender,ST.role,ST.date,ST.kAns,discDone()?dcNums():null)}
function parseCode(s){
  s=String(s||"").replace(/[\s\u200b]+/g,"").toUpperCase().replace(/[‐-―−]/g,"-");
  const m=s.match(/^([MF])([A-Z])-([1-4]{26})(?:-([WS])([0-9A-S]{8})?(?:-(\d{6}))?)?$/);
  if(!m)return{err:"코드 모양이 맞지 않아요. 빠진 글자가 없는지 확인해 주세요."};
  if(m[2]!==CFG.letter)return{err:"KOSS 단축형(26문항) 결과 코드가 아니에요."};
  const k=m[3].split("").map((p,i)=>Q[i].r?5-+p:+p);
  let dd=null;if(m[5]){dd=m[5].split("").map(c=>B36.indexOf(c));if(dcCheck(dcFrom(dd)))return{err:"코드 일부가 잘못됐어요. 다시 복사해 주세요."}}
  let d="";if(m[6]){d="20"+m[6].slice(0,2)+"-"+m[6].slice(2,4)+"-"+m[6].slice(4);if(!/^20\d\d-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(d))d=""}
  return{g:m[1]==="F"?"f":"m",r:m[4]?(m[4]==="S"?"s":"w"):"",d,k,dd};
}
function scoreOf(k,g){const sv={g:S.gender,a:S.ans};S.gender=g;S.ans=k.slice();const R=score();S.gender=sv.g;S.ans=sv.a;return R}
const codeBox=(note)=>`<div class="codebox"><p class="code" id="rcode">${esc(curCode())}</p>${note?`<p class="small muted">${note}</p>`:""}<div class="row"><button class="btn ghost" type="button" id="copyCode">결과 코드 복사</button></div></div>`;
function wireCode(){const b=$("copyCode");if(!b)return;b.addEventListener("click",()=>{const t=curCode();navigator.clipboard.writeText(t).then(()=>toast("결과 코드를 복사했어요. 메모나 '나에게 보내기'에 붙여 두세요.")).catch(()=>{const r=document.createRange();r.selectNodeContents($("rcode"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("코드를 선택해 두었어요. 길게 눌러 복사해 주세요.")})})}

const PER=6,KPAGES=Math.ceil(Q.length/PER);
function renderKossPage(){
  const p=Math.min(Math.max(ST.kPage,1),KPAGES);ST.kPage=p;
  const from=(p-1)*PER,to=Math.min(p*PER,Q.length);
  const answered=ST.kAns.filter(Boolean).length;
  let h=`<section class="card">
    <p class="kicker">STEP 1 · 나의 직무스트레스 확인 · ${esc(CFG.name)}(${esc(CFG.code)})</p>
    <h2>최근 1개월, 내 일터는 어땠나요?</h2>
    <div class="prog"><div class="bar"><i style="width:${Math.round(answered/Q.length*100)}%"></i></div><b>${answered} / ${Q.length}</b></div>
    <p class="small muted">${p}장 / ${KPAGES}장 · 6문항씩 넘깁니다.</p>
  </section><form id="pf" novalidate style="display:flex;flex-direction:column;gap:12px">`;
  for(let i=from;i<to;i++){
    h+=`<fieldset class="q card" id="q${i}"><legend class="q-head"><span class="q-no">${String(i+1).padStart(2,"0")}</span><span><span class="q-dom">${DOM_OF[i]}</span>${esc(Q[i].t)}</span></legend>
      <div class="opt">${OPTS.map((o,j)=>`<label><input type="radio" name="a${i}" id="a${i}-${j}" value="${j}" ${ST.kAns[i]===j+1?"checked":""}><span>${o}</span></label>`).join("")}</div>
      <p class="q-miss">이 문항에 아직 답하지 않았어요.</p></fieldset>`;
  }
  h+=`<div class="row"><button class="btn ghost" type="button" id="prev">이전</button><button class="btn" type="submit">${p===KPAGES?"STEP 1 결과 보기":"다음 장"}</button></div></form>`;
  app.innerHTML=h;
  const f=$("pf");
  f.addEventListener("change",e=>{
    const m=/^a(\d+)$/.exec(e.target.name);if(!m)return;
    const i=+m[1];ST.kAns[i]=+e.target.value+1;ST.sample=false;save();
    $("q"+i).classList.remove("missing");
    const next=[...Array(to-from).keys()].map(k=>k+from).find(k=>k>i&&!ST.kAns[k]);
    if(next!==undefined)setTimeout(()=>{const el=$("q"+next);if(el)el.scrollIntoView({behavior:"smooth",block:"center"})},150);
  });
  f.addEventListener("submit",e=>{e.preventDefault();
    const miss=[];for(let i=from;i<to;i++)if(!ST.kAns[i])miss.push(i);
    document.querySelectorAll(".q").forEach(el=>el.classList.remove("missing"));
    if(miss.length){miss.forEach(i=>$("q"+i).classList.add("missing"));toast(miss.map(i=>(i+1)+"번").join(", ")+" 문항이 비어 있어요.");$("q"+miss[0]).scrollIntoView({behavior:"smooth",block:"center"});return}
    if(p<KPAGES){ST.kPage=p+1;render();top0();return}
    const left=ST.kAns.map((a,i)=>a?-1:i).filter(i=>i>=0);
    if(left.length){toast(left.map(i=>(i+1)+"번").join(", ")+" 문항이 비어 있어요. 해당 장으로 이동합니다.");ST.kPage=Math.floor(left[0]/PER)+1;render();top0();return}
    go("s1r");
  });
  $("prev").addEventListener("click",()=>{if(p>1){ST.kPage=p-1;render();top0()}else go("home")});
}

function candidates(focus,primary){
  const list=[];
  if(ST.react!=="")list.push({tag:"내가 고른 반응",t:REACTS[+ST.react][1],ev:"r",src:SRC_REACT});
  const sd=ST.sit!==""?SITS[+ST.sit][1]:null;
  if(sd){const fd=focus.find(d=>d.k===sd)||{k:sd};focus=[fd,...focus.filter(d=>d.k!==sd)]}
  focus.forEach(d=>TIPS[d.k].me.forEach(t=>list.push({tag:"일터 요인 · "+d.k,t,ev:"r",src:SRC_DOM[d.k]||SRC.domain})));
  primary.forEach(p=>INFO[p].manage.forEach(t=>list.push({tag:"내 유형 · "+p+"형 (참고)",t,ev:"s",src:SRC.disc})));
  BASICS.forEach(t=>list.push({tag:"기본 회복 습관",t,ev:"r",src:SRC.basic}));
  return list;
}

async function makePdf(){
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({unit:"mm",format:"a4",orientation:"portrait"});
  const PW=210,PH=297,M=10,CW=PW-2*M;let y=M;
  const nodes=buildReport();
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  for(const n of nodes){
    const cv=await html2canvas(n,{scale:2,backgroundColor:"#ffffff",logging:false});
    const h=cv.height*CW/cv.width;
    if(h>PH-2*M){
      const sliceH=Math.floor(cv.width*(PH-2*M)/CW);let sy=0;
      while(sy<cv.height){
        if(y>M){pdf.addPage();y=M}
        const part=document.createElement("canvas");part.width=cv.width;part.height=Math.min(sliceH,cv.height-sy);
        part.getContext("2d").drawImage(cv,0,sy,cv.width,part.height,0,0,cv.width,part.height);
        const ph=part.height*CW/cv.width;pdf.addImage(part.toDataURL("image/jpeg",0.92),"JPEG",M,y,CW,ph);y+=ph;sy+=sliceH;
      }
      continue;
    }
    if(y+h>PH-M){pdf.addPage();y=M}
    pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",M,y,CW,h);y+=h;
  }
  const pages=pdf.getNumberOfPages();
  for(let i=1;i<=pages;i++){pdf.setPage(i);pdf.setFontSize(8);pdf.setTextColor(120);pdf.text(i+" / "+pages,PW/2,PH-5,{align:"center"})}
  $("report").innerHTML="";
  return pdf;
}
const pdfSection=()=>`<section class="card noprint">
    <h2>결과지 PDF로 받기</h2>
    <p class="small muted">STEP 1~4 결과, 8각형 도표, DISC 그래프, 나의 실천 카드, 4주 계획, 메모를 A4 PDF 한 파일로 저장합니다. 파일은 이 휴대폰(PC)에만 저장되고 어디에도 전송되지 않습니다.</p>
    <div class="row"><button class="btn" type="button" id="pdf">PDF 다운로드</button></div>
    <p class="small muted" id="pdfMsg" role="status" hidden></p>
  </section>`;
function saveAlt(blob,url,name,samsung){
  const msg=$("pdfMsg");let box=$("pdfAlt");if(box)box.remove();
  box=document.createElement("div");box.id="pdfAlt";box.className="row noprint";
  let file=null;try{file=new File([blob],name,{type:"application/pdf"})}catch(e){}
  const canShare=!!(file&&navigator.canShare&&navigator.canShare({files:[file]}));
  box.innerHTML=`${canShare?`<button class="btn" type="button" id="pdfShare">파일로 저장·공유</button>`:""}<a class="btn ${canShare?"ghost":""}" id="pdfOpen" href="${url}" target="_blank" rel="noopener">PDF 열기</a>`;
  msg.textContent=samsung?"PDF가 준비됐어요. '파일로 저장·공유'를 눌러 내 파일에 저장하거나, 'PDF 열기'로 연 뒤 저장해 주세요.":"PDF를 내려받았습니다. 다운로드 폴더(휴대폰은 '파일' 앱)를 확인해 주세요. 받아지지 않았다면 아래 버튼을 눌러 주세요.";
  msg.hidden=false;msg.after(box);
  const sh=$("pdfShare");if(sh)sh.addEventListener("click",()=>{navigator.share({files:[file],title:"직무스트레스 4단계 점검 결과"}).catch(e=>{if(!e||e.name!=="AbortError"){msg.textContent="공유 창을 열지 못했어요. 'PDF 열기'를 눌러 주세요."}})});
}
function wirePdf(){
  const btn=$("pdf");if(!btn)return;const msg=$("pdfMsg");
  const show=t=>{msg.textContent=t;msg.hidden=false};
  const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
  btn.addEventListener("click",async()=>{
    if(!window.jspdf||!window.html2canvas){show("PDF 도구를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 페이지를 새로 열어 주세요.");return}
    let dl=null;
    if(inFrame){try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){dl=null}
      if(!dl){show("이 화면에서는 파일 저장을 쓸 수 없습니다. '결과 요약 복사'로 내용을 옮겨 주세요.");return}}
    btn.disabled=true;btn.textContent="PDF 만드는 중…";msg.hidden=true;
    const fn=`직무스트레스_4단계_결과_${ST.date||todayKST()}.pdf`;
    try{
      const pdf=await makePdf();
      if(dl){await dl.save({filename:fn,data:pdf.output("blob")});show("PDF를 저장했습니다.")}
      else{const blob=pdf.output("blob");const name=`stress-check-result_${ST.date||todayKST()}.pdf`; /* 일부 브라우저가 한글 파일명을 지우므로 영문 */
        const url=URL.createObjectURL(blob);setTimeout(()=>URL.revokeObjectURL(url),600000);
        /* 삼성 인터넷은 blob 다운로드를 막는 경우가 있어 자동 다운로드 대신 공유·열기 버튼을 바로 보여 줌 */
        const samsung=/SamsungBrowser/i.test(navigator.userAgent);
        if(!samsung){const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}
        saveAlt(blob,url,name,samsung)}
    }catch(e){
      $("report").innerHTML="";
      const c=e&&e.code;
      show(c==="declined"?"저장을 취소했습니다. 다시 누르면 받을 수 있습니다.":c==="rate_limited"?"저장 창이 이미 열려 있습니다. 잠시 뒤 다시 눌러 주세요.":"PDF를 만들지 못했습니다. 잠시 뒤 다시 시도해 주세요.");
    }finally{btn.disabled=false;btn.textContent="PDF 다운로드"}
  });
}
